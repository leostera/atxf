[package]
name = "atxf"
version = "0.1.0"
edition = "2024"
description = "ATXF, the Agent Transcript Exchange Format: types, validation, integrity, lossless converters for coding-agent sessions, and reconciliation"
license = "MIT"
authors = ["Leo Ostera"]
repository = "https://github.com/leostera/atxf"
homepage = "https://atxf.leostera.dev"
readme = "README.md"
keywords = ["agents", "transcripts", "llm", "sessions", "jsonl"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "schema/**", "README.md", "LICENSE"]

[lib]
name = "atxf"
path = "src/lib.rs"

[[bin]]
name = "atxf"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "0.60", default-features = false }
regex = "1"
ryu-js = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

# sha2 uses the ARMv8 SHA-256 instructions only with its `asm` feature; without it, Apple Silicon and other aarch64
# machines hash in software at about a quarter of the speed. x86_64 detects SHA-NI at runtime without it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
